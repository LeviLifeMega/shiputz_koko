<style>

    --bg:#f4f5f7; --card:#fff; --ink:#1c1e21; --muted:#6b7280;
    --line:#e3e5e8; --ok:#16a34a; --ok-soft:#eaf7ee; --warn:#d97706;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Arial,sans-serif;
    font-size:16px; line-height:1.5; padding-bottom:40px;
  }
  .wrap{max-width:620px;margin:0 auto;padding:0 14px}

  /* ---------- כותרת דביקה ---------- */
  header{
    position:sticky; top:0; z-index:30; background:rgba(244,245,247,.94);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 0 10px;
  }
  h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .bar{height:7px;background:#e6e8ec;border-radius:99px;overflow:hidden;margin-top:10px}
  .bar>i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .35s ease}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:12.5px;color:var(--muted)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--muted);margin-left:6px;vertical-align:middle}
  .dot.on{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.off{background:#dc2626}

  /* ---------- קומה ---------- */
  .floor{margin:22px 0 10px;display:flex;align-items:baseline;gap:9px}
  .floor h2{margin:0;font-size:16px;font-weight:700}
  .floor span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- משימה ---------- */
  .task{
    display:flex;gap:12px;align-items:center;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:10px;
    margin-bottom:9px;box-shadow:var(--shadow);transition:background .2s,border-color .2s;
  }
  .task.done{background:var(--ok-soft);border-color:#c9e9d4}
  .task.done .title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}

  .thumbwrap{position:relative;flex:0 0 64px;width:64px;height:64px}
  .thumb{
    width:64px;height:64px;border-radius:10px;object-fit:cover;
    background:#e9ebef;border:1px solid var(--line);cursor:zoom-in;display:block;
  }
  .thumb.none{display:flex;align-items:center;justify-content:center;font-size:22px;color:#aab;cursor:default}
  .badge{
    position:absolute;bottom:-4px;left:-4px;background:#1c1e21;color:#fff;
    font-size:11px;font-weight:600;line-height:1;padding:3px 6px;border-radius:99px;
    border:2px solid var(--card);pointer-events:none;
  }

  .txt{flex:1;min-width:0}
  .title{font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
  .title.pending{color:var(--warn)}
  .where{font-size:13px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
  .task.done .where{opacity:.55}

  /* צ'קבוקס גדול לאצבע */
  .box{
    flex:0 0 34px;width:34px;height:34px;border-radius:9px;border:2px solid #cdd2da;
    background:#fff;cursor:pointer;position:relative;transition:all .18s ease;
  }
  .box::after{
    content:"";position:absolute;inset:0;margin:auto;width:9px;height:16px;
    border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) scale(.4) translateY(-1px);
    opacity:0;transition:all .18s ease;
  }
  .box[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
  .box[aria-checked="true"]::after{opacity:1;transform:rotate(45deg) scale(1) translateY(-1px)}
  body.viewonly .box{cursor:default;opacity:.85}

  /* ---------- הגדלת תמונה ---------- */
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:100;overflow-y:auto}
  #lb.on{display:block}

  #lb .x{position:fixed;top:12px;left:16px;color:#fff;font-size:36px;line-height:1;cursor:pointer;z-index:2}

  .banner{

/* =========================================================
   2. סנכרון
   ========================================================= */
const KEY     = 'levilife-mitcham-tikunim-4f9a2c7b1e';
const REMOTE  = 'https://textdb.dev/api/data/' + KEY;
const LOCAL   = 'checklist:' + KEY;
const POLL_MS = 5000;

// מצב צפייה בלבד: להוסיף ?view לכתובת. מונע סימון בטעות.
const VIEW_ONLY = new URLSearchParams(location.search).has('view');
if (VIEW_ONLY) document.body.classList.add('viewonly');

/* state = { "f1-01": {v:true, t:1234567890}, ... }
   לכל פריט חותמת זמן משלו, ובמיזוג מנצח הסימון החדש יותר.
   כך שני מכשירים פתוחים במקביל לא דורסים זה את זה. */
let state = loadLocal();

function loadLocal(){
  try { return JSON.parse(localStorage.getItem(LOCAL)) || {}; }
  catch { return {}; }
}
function saveLocal(){
  try { localStorage.setItem(LOCAL, JSON.stringify(state)); } catch {}
}
function merge(incoming){
  let changed = false;
  for (const id in incoming){
    const a = state[id], b = incoming[id];
    if (!b || typeof b.t !== 'number') continue;
    if (!a || b.t > a.t){ state[id] = b; changed = true; }
  }
  return changed;
}

/* ---- אינדיקטור מצב ---- */
const dotEl = document.getElementById('dot');
const txtEl = document.getElementById('syncTxt');
const banEl = document.getElementById('banner');
function setSync(cls, txt){ dotEl.className = 'dot ' + cls; txtEl.textContent = txt; }
function setBanner(msg){
  banEl.textContent = msg || '';
  banEl.classList.toggle('on', !!msg);
}
const OFFLINE_MSG = 'אין חיבור לשרת כרגע. הסימונים שלך נשמרים במכשיר ויעלו אוטומטית כשהחיבור יחזור.';

/* ---- משיכה מהשרת ומיזוג לתוך המצב המקומי ---- */
async function fetchAndMerge(){
  const res = await fetch(REMOTE + '?t=' + Date.now(), {cache:'no-store'});
  if (!res.ok) throw new Error(res.status);
  const raw = (await res.text()).trim();
  if (raw){
    const data = JSON.parse(raw);
    if (data && data.items && merge(data.items)){ saveLocal(); render(); }
  }
}

async function pull(){
  try{
    await fetchAndMerge();
    setSync('on', VIEW_ONLY ? 'מעודכן' : 'מסונכרן');
    setBanner('');
  }catch(e){
    setSync('off', 'לא מחובר');
    setBanner(OFFLINE_MSG);
  }
}

/* ---- דחיפה לשרת, עם השהייה קצרה כדי לא להציף ---- */
let pushTimer = null, pushing = false, pendingPush = false;
function schedulePush(){
  if (VIEW_ONLY) return;
  setSync('busy', 'שומר...');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 700);
}
async function push(){
  if (pushing){ pendingPush = true; return; }
  pushing = true;
  try{
    /* קריטי: קודם מושכים וממזגים את מה שכבר בענן, ורק אז דוחפים.
       בלי זה, דחיפה של מכשיר אחד מוחקת את הסימונים של השני. */
    try { await fetchAndMerge(); } catch(e){ /* אם המשיכה נכשלה, עדיין ננסה לדחוף */ }

    const res = await fetch(REMOTE, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({items: state, updated: new Date().toISOString()})
    });
    if (!res.ok) throw new Error(res.status);
    setSync('on', 'מסונכרן');
    setBanner('');
  }catch(e){
    setSync('off', 'לא נשמר בענן');
    setBanner(OFFLINE_MSG);
    setTimeout(schedulePush, 20000); // ניסיון חוזר
  }finally{
    pushing = false;
    if (pendingPush){ pendingPush = false; schedulePush(); }
  }
}

/* =========================================================
   3. בנייה והצגה
   ========================================================= */
const listEl = document.getElementById('list');

function isDone(id){ return !!(state[id] && state[id].v); }

function toggle(id){
  if (VIEW_ONLY) return;
  state[id] = {v: !isDone(id), t: Date.now()};
  saveLocal();
  render();
  schedulePush();
}

function noPhoto(){
  const d = document.createElement('div');
  d.className = 'thumb none'; d.textContent = '🔧';
  return d;
}

function buildThumb(task){
  const wrap = document.createElement('div');
  wrap.className = 'thumbwrap';
  const list = task.photos || [];

  if (!list.length){ wrap.appendChild(noPhoto()); return wrap; }

  const img = document.createElement('img');
  img.className = 'thumb';
  img.src = list[0];
  img.alt = task.title;
  img.loading = 'lazy';
  img.addEventListener('click', e => { e.stopPropagation(); openLightbox(task); });
  img.addEventListener('error', () => img.replaceWith(noPhoto()));
  wrap.appendChild(img);

  if (list.length > 1){
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = list.length;
    wrap.appendChild(b);
  }
  return wrap;
}

function build(){
  const floors = [...new Set(TASKS.map(t => t.floor))].sort((a,b)=>a-b);
  listEl.innerHTML = '';
  for (const f of floors){
    const head = document.createElement('div');
    head.className = 'floor';
    head.innerHTML = '<h2>' + (FLOOR_NAMES[f] || ('קומה ' + f)) +
                     '</h2><span data-fc="' + f + '"></span>';
    listEl.appendChild(head);

    for (const t of TASKS.filter(x => x.floor === f)){
      const row = document.createElement('div');
      row.className = 'task';
      row.dataset.id = t.id;

      row.appendChild(buildThumb(t));

      const txt = document.createElement('div');
      txt.className = 'txt';

      const ttl = document.createElement('div');
      ttl.className = 'title' + (t.title === 'ממתין לפירוט' ? ' pending' : '');
      ttl.textContent = t.title;
      txt.appendChild(ttl);

      if (t.where){
        const whr = document.createElement('div');
        whr.className = 'where'; whr.textContent = t.where;
        txt.appendChild(whr);
      }
      row.appendChild(txt);

      const box = document.createElement('div');
      box.className = 'box';
      box.setAttribute('role','checkbox');
      box.setAttribute('tabindex','0');
      box.setAttribute('aria-label', t.title + (t.where ? ' - ' + t.where : ''));
      box.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); toggle(t.id); }
      });
      row.appendChild(box);

      // הקשה בכל מקום בשורה מסמנת, חוץ מהתמונה שפותחת הגדלה
      row.addEventListener('click', () => toggle(t.id));

      listEl.appendChild(row);
    }
  }
}

function render(){
  let total = 0, done = 0;
  const per = {};
  for (const t of TASKS){
    const d = isDone(t.id);
    total++; if (d) done++;
    per[t.floor] = per[t.floor] || {t:0, d:0};
    per[t.floor].t++; if (d) per[t.floor].d++;

    const row = listEl.querySelector('.task[data-id="' + t.id + '"]');
    if (row){
      row.classList.toggle('done', d);
      row.querySelector('.box').setAttribute('aria-checked', d ? 'true' : 'false');
    }
  }
  for (const f in per){
    const el = listEl.querySelector('[data-fc="' + f + '"]');
    if (el) el.textContent = per[f].d + '/' + per[f].t;
  }
  document.getElementById('count').textContent = done + ' מתוך ' + total + ' הושלמו';
  document.getElementById('barFill').style.width = total ? (done/total*100) + '%' : '0%';
}

/* ---- הגדלת תמונה, כולל כמה תמונות לאותה משימה ---- */
const lb = document.getElementById('lb');
const lbInner = lb.querySelector('.inner');
function openLightbox(task){
  lbInner.innerHTML = '';
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.textContent = task.title + (task.where ? ' - ' + task.where : '');
  lbInner.appendChild(cap);
  for (const src of (task.photos || [])){
    const im = document.createElement('img');
    im.src = src; im.alt = task.title;
    lbInner.appendChild(im);
  }
  lb.scrollTop = 0;
  lb.classList.add('on');
}
lb.addEventListener('click', () => lb.classList.remove('on'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });

/* =========================================================
   4. הפעלה
   ========================================================= */
build();
render();
pull();

setInterval(pull, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
window.addEventListener('online', () => { pull(); if (!VIEW_ONLY) schedulePush(); });
</script>
